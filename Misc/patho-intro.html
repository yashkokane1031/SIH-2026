<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PATHO Intelligence — Clinical Decision Support</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#050b14;
    --navy-900:#081220;
    --navy-800:#0e1b2c;
    --grid-line: rgba(59,130,246,0.08);
    --grid-line-bright: rgba(56,189,248,0.35);
    --blue-600:#2563eb;
    --blue-500:#3b82f6;
    --blue-400:#60a5fa;
    --blue-300:#93c5fd;
    --cyan-400:#38bdf8;
    --blue-glow: rgba(59,130,246,0.6);
    --ink-100:#f8fafc;
    --ink-400:#7d92b3;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--navy-950);
    font-family:'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow:hidden;
    user-select:none;
  }

  /* ---------- STAGE ---------- */
  #stage{
    position:relative;
    width:100%; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 900px 600px at 50% 38%, rgba(59,130,246,0.12), transparent 70%),
      linear-gradient(180deg, var(--navy-950) 0%, var(--navy-900) 50%, var(--navy-950) 100%);
    transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1), transform 0.8s cubic-bezier(0.4,0,0.2,1);
  }

  /* whole-slide grid backdrop */
  #grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 42px 42px;
    opacity:0;
    animation: gridIn 1.1s ease-out 0.15s forwards;
  }
  @keyframes gridIn{ to{ opacity:1; } }

  /* scanning sweep line — whole-slide-imaging laser */
  #sweep{
    position:absolute; left:0; right:0; top:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--blue-500) 20%, #e0f2fe 50%, var(--blue-500) 80%, transparent);
    box-shadow:0 0 24px 4px var(--blue-glow), 0 0 60px 10px rgba(56,189,248,0.35);
    opacity:0;
    animation: sweepDown 1.25s cubic-bezier(.6,0,.3,1) 0.3s forwards;
    pointer-events:none;
  }
  @keyframes sweepDown{
    0%{ top:0%; opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:1; }
    100%{ top:100%; opacity:0; }
  }
  #sweep-trail{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(59,130,246,0.12), transparent 45%);
    clip-path: inset(0 0 100% 0);
    animation: trailReveal 1.25s cubic-bezier(.6,0,.3,1) 0.3s forwards;
    pointer-events:none;
  }
  @keyframes trailReveal{ to{ clip-path: inset(0 0 0 0); } }

  /* cytological tissue nodes */
  #node-field{
    position:absolute; inset:0;
    pointer-events:none;
  }
  .tissue-node{
    position:absolute;
    width:4px; height:4px;
    border-radius:50%;
    background:var(--cyan-400);
    opacity:0;
    box-shadow:0 0 8px var(--cyan-400);
    animation: nodeLight 2.2s ease-in-out forwards;
  }
  @keyframes nodeLight{
    0%{ opacity:0; transform:scale(0.4); }
    25%{ opacity:0.9; transform:scale(1.6); }
    60%{ opacity:0.4; transform:scale(1); }
    100%{ opacity:0.15; transform:scale(0.8); }
  }

  /* ---------- LOGO CLUSTER ---------- */
  #logo-wrap{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
    transform: translateY(0);
    transition: transform 0.8s cubic-bezier(.65,0,.35,1), opacity 0.5s ease;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:13px; font-weight:600;
    letter-spacing:0.38em;
    color:var(--cyan-400);
    text-transform:uppercase;
    margin-bottom:24px;
    opacity:0;
    transform:translateY(8px);
    animation: fadeUp 0.7s ease 1.75s forwards;
  }

  .mark-row{
    display:flex; align-items:center; gap:20px;
  }

  /* icon: rounded square with 3 pulse bars */
  #icon{
    width:68px; height:68px;
    border-radius:18px;
    background:linear-gradient(135deg,#1e40af,#2563eb 60%,#60a5fa);
    display:flex; align-items:center; justify-content:center;
    gap:6px;
    opacity:0;
    transform:scale(0.7);
    box-shadow:0 0 0 0 rgba(59,130,246,0);
    animation: iconIn 0.6s cubic-bezier(.34,1.56,.64,1) 0.9s forwards,
               iconGlow 2.5s ease-in-out 1.5s infinite;
  }
  @keyframes iconIn{
    to{ opacity:1; transform:scale(1); }
  }
  @keyframes iconGlow{
    0%,100%{ box-shadow:0 0 20px 0 rgba(59,130,246,0.4); }
    50%{ box-shadow:0 0 35px 6px rgba(59,130,246,0.65); }
  }

  .bar{
    width:7px; border-radius:4px;
    background:#f8fafc;
    height:0;
    transform-origin:bottom;
    animation: barRise 0.5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .bar:nth-child(1){ animation-delay:1.1s; }
  .bar:nth-child(2){ animation-delay:1.22s; }
  .bar:nth-child(3){ animation-delay:1.34s; }
  .bar:nth-child(1).final{ height:16px; }
  .bar:nth-child(2).final{ height:30px; }
  .bar:nth-child(3).final{ height:22px; }
  @keyframes barRise{
    0%{ height:0; }
    100%{ height: var(--h); }
  }

  .wordmark{ display:flex; flex-direction:column; text-align:left; }

  #patho{
    font-size:42px; font-weight:700; letter-spacing:0.02em;
    color:var(--ink-100);
    line-height:1;
    display:flex;
  }
  #patho span{
    display:inline-block;
    opacity:0;
    transform:translateY(14px);
    animation: fadeUp 0.55s cubic-bezier(.25,.8,.35,1) forwards;
  }
  #patho span:nth-child(1){ animation-delay:1.45s; }
  #patho span:nth-child(2){ animation-delay:1.51s; }
  #patho span:nth-child(3){ animation-delay:1.57s; }
  #patho span:nth-child(4){ animation-delay:1.63s; }
  #patho span:nth-child(5){ animation-delay:1.69s; }

  #intelligence{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; font-weight:600;
    color:var(--blue-300);
    text-transform:uppercase;
    margin-top:6px;
    opacity:0;
    letter-spacing:0.15em;
    animation: trackIn 0.8s ease 1.95s forwards;
  }
  @keyframes trackIn{
    0%{ opacity:0; letter-spacing:0.5em; }
    100%{ opacity:1; letter-spacing:0.34em; }
  }

  @keyframes fadeUp{
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- CTA ---------- */
  #cta{
    margin-top:48px;
    opacity:0;
    transform:translateY(12px);
    animation: fadeUp 0.7s ease 2.45s forwards;
    display:flex; flex-direction:column; align-items:center;
  }
  #get-started{
    font-family:'Space Grotesk', sans-serif;
    font-size:16px; font-weight:700;
    color:#030712;
    background:var(--ink-100);
    border:none; border-radius:10px;
    padding:15px 30px;
    display:inline-flex; align-items:center; gap:12px;
    cursor:pointer;
    letter-spacing:0.01em;
    box-shadow:0 0 0 0 rgba(248,250,252,0);
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    animation: ctaPulse 2.6s ease-in-out 3.2s infinite;
  }
  #get-started:hover{
    transform:translateY(-2px);
    background:#ffffff;
    box-shadow:0 10px 30px -4px rgba(59,130,246,0.6);
  }
  #get-started:active{ transform:translateY(0px) scale(0.98); }
  #get-started svg{ width:18px; height:18px; transition:transform 0.25s ease; }
  #get-started:hover svg{ transform:translateX(4px); }
  @keyframes ctaPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(248,250,252,0.0); }
    50%{ box-shadow:0 0 0 8px rgba(248,250,252,0.0), 0 0 24px 3px rgba(59,130,246,0.45); }
  }
  .key-hint{
    margin-top:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:#64748b;
    letter-spacing:0.08em;
  }

  /* ---------- SOUND TOGGLE ---------- */
  #sound-toggle{
    position:absolute; top:28px; right:28px; z-index:10;
    width:42px; height:42px;
    border-radius:50%;
    border:1px solid rgba(147,197,253,0.25);
    background:rgba(14,27,44,0.65);
    backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--blue-300);
    opacity:0;
    animation: fadeUp 0.6s ease 0.5s forwards;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  #sound-toggle:hover{ border-color:rgba(147,197,253,0.6); transform:translateY(-2px); background:rgba(23,37,84,0.8); }
  #sound-toggle svg{ width:18px; height:18px; }
  #sound-toggle .icon-muted{ display:none; }
  #sound-toggle.muted .icon-on{ display:none; }
  #sound-toggle.muted .icon-muted{ display:block; }

  /* ---------- EXIT / HANDOFF STATE ---------- */
  #stage.leaving{
    opacity:0;
    transform:scale(1.02);
    pointer-events:none;
  }
  #stage.leaving #logo-wrap{
    transform:translateY(-30px) scale(0.95);
    opacity:0;
  }
  #stage.leaving .eyebrow,
  #stage.leaving #cta,
  #stage.leaving #sound-toggle{
    opacity:0 !important;
  }
  #site-reveal{
    position:absolute; inset:0;
    background:var(--navy-950);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.7s ease 0.3s;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    color:var(--ink-400);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    letter-spacing:0.08em;
    padding:40px;
  }
  #site-reveal a{
    margin-top:20px;
    color:var(--blue-400);
    text-decoration:none;
    border:1px solid rgba(96,165,250,0.3);
    padding:10px 20px;
    border-radius:8px;
    background:rgba(59,130,246,0.1);
  }
  #stage.leaving #site-reveal{ opacity:1; pointer-events:auto; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  @media (max-width:540px){
    #patho{ font-size:32px; }
    #icon{ width:56px; height:56px; }
    .eyebrow{ font-size:11px; letter-spacing:0.25em; }
    #get-started{ font-size:14px; padding:13px 24px; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="grid"></div>
  <div id="sweep-trail"></div>
  <div id="sweep"></div>
  <div id="node-field"></div>

  <button id="sound-toggle" onclick="toggleMute()" aria-label="Toggle sound" title="Toggle sound (M)">
    <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m23 9-6 6"/><path d="m17 9 6 6"/></svg>
  </button>

  <div id="logo-wrap">
    <div class="eyebrow">Clinical Decision Support · ABMIL</div>
    <div class="mark-row">
      <div id="icon">
        <div class="bar final" style="--h:16px"></div>
        <div class="bar final" style="--h:30px"></div>
        <div class="bar final" style="--h:22px"></div>
      </div>
      <div class="wordmark">
        <div id="patho">
          <span>P</span><span>A</span><span>T</span><span>H</span><span>O</span>
        </div>
        <div id="intelligence">Intelligence</div>
      </div>
    </div>
    <div id="cta">
      <button id="get-started" onclick="enterSite()">
        <span>Get Started</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <span class="key-hint">Press [Space] or [Enter] to begin</span>
    </div>
  </div>

  <div id="site-reveal">
    <div>Connecting to PATHO Clinical Decision Workspace...</div>
    <a href="http://localhost:5174/">Open Dashboard (Port 5174) →</a>
  </div>
</div>

<script>
  /* ---------- GENERATE CYTOLOGICAL TISSUE NODES ---------- */
  const nodeField = document.getElementById('node-field');
  for (let i = 0; i < 36; i++) {
    const node = document.createElement('div');
    node.className = 'tissue-node';
    node.style.top = (15 + Math.random() * 70) + '%';
    node.style.left = (10 + Math.random() * 80) + '%';
    node.style.animationDelay = (0.4 + Math.random() * 0.9) + 's';
    nodeField.appendChild(node);
  }

  /* ---------- SOUND SYNTHESIZER (Web Audio API) ---------- */
  let audioCtx = null;
  let muted = false;

  function getCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone({freq=440, delay=0, dur=0.3, type='sine', peak=0.14, glideTo=null}){
    if(muted) return;
    const c = getCtx(); if(!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function sweepSound(delay=0){
    if(muted) return;
    const c = getCtx(); if(!c) return;
    const t0 = c.currentTime + delay;
    const dur = 1.15;
    const bufferSize = Math.floor(c.sampleRate * dur);
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.35;
    const noise = c.createBufferSource();
    noise.buffer = buffer;
    const filter = c.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 5.5;
    filter.frequency.setValueAtTime(450, t0);
    filter.frequency.exponentialRampToValueAtTime(2400, t0 + dur);
    const gain = c.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(0.12, t0 + 0.15);
    gain.gain.linearRampToValueAtTime(0.08, t0 + dur * 0.7);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    noise.connect(filter).connect(gain).connect(c.destination);
    noise.start(t0);
    noise.stop(t0 + dur + 0.05);
    tone({freq:180, delay, dur, type:'sine', peak:0.06, glideTo:600});
  }

  function playClickSound(){
    tone({freq:720, delay:0, dur:0.1, type:'triangle', peak:0.16});
    tone({freq:1300, delay:0.03, dur:0.28, type:'sine', peak:0.12, glideTo:2200});
  }

  const introTimers = [];
  function scheduleIntroSounds(){
    introTimers.push(setTimeout(() => sweepSound(0), 300));
    introTimers.push(setTimeout(() => tone({freq:523.25, dur:0.35, peak:0.12}), 1100)); // Bar 1 — C5
    introTimers.push(setTimeout(() => tone({freq:659.25, dur:0.35, peak:0.12}), 1220)); // Bar 2 — E5
    introTimers.push(setTimeout(() => tone({freq:783.99, dur:0.4,  peak:0.12}), 1340)); // Bar 3 — G5
    introTimers.push(setTimeout(() => tone({freq:1046.5, dur:0.55, peak:0.09}), 2450)); // CTA chord — C6
  }
  scheduleIntroSounds();

  function toggleMute(){
    muted = !muted;
    document.getElementById('sound-toggle').classList.toggle('muted', muted);
    if(!muted) getCtx();
  }

  function enterSite(){
    playClickSound();
    introTimers.forEach(clearTimeout);
    document.getElementById('stage').classList.add('leaving');
    setTimeout(() => {
      // If deployed alongside dashboard on port 5174:
      // window.location.href = 'http://localhost:5174/';
    }, 750);
  }

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      enterSite();
    } else if (e.key === 'm' || e.key === 'M') {
      toggleMute();
    }
  });
</script>

</body>
</html>
